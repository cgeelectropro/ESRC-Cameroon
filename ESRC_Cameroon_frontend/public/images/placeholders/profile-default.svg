<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" rx="60" fill="#f5f5f5"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="profileGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:0.08" />
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#profileGrad)"/>
  
  <!-- User icon (larger) -->
  <g fill="#1B5E20" opacity="0.7">
    <!-- Head -->
    <circle cx="60" cy="35" r="14"/>
    <!-- Body -->
    <path d="M 60,48 Q 42,58 42,75 L 78,75 Q 78,58 60,48 Z"/>
  </g>
  
  <!-- Border -->
  <circle cx="60" cy="60" r="60" fill="none" stroke="#e0e0e0" stroke-width="2"/>
</svg>
