<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Background -->
  <rect width="320" height="180" fill="#f5f5f5"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#thumbGrad)"/>
  
  <!-- Center icon -->
  <g transform="translate(160, 90)" stroke="#1B5E20" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Image frame -->
    <rect x="-20" y="-15" width="40" height="30" rx="2"/>
    <!-- Mountain/image icon -->
    <path d="M -18,-8 L -10,-2 L 0,-8 L 8,-2 L 18,-8"/>
    <!-- Circle (sun) -->
    <circle cx="10" cy="-5" r="3" fill="#1B5E20" opacity="0.6"/>
  </g>
</svg>
