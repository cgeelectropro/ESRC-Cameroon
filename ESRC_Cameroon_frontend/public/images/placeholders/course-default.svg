<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad)"/>
  
  <!-- Center circle with icon -->
  <circle cx="200" cy="150" r="40" fill="#1B5E20" opacity="0.2"/>
  
  <!-- Course icon (book) -->
  <g transform="translate(200, 150)" stroke="#1B5E20" stroke-width="2" fill="none">
    <!-- Book -->
    <path d="M -15,-10 L 0,-10 Q 10,-10 10,0 L 10,20 Q 10,30 0,30 L -15,30 Z" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-10 L 0,30"/>
    <!-- Pages -->
    <line x1="-10" y1="-5" x2="5" y2="-5"/>
    <line x1="-10" y1="0" x2="5" y2="0"/>
    <line x1="-10" y1="5" x2="5" y2="5"/>
    <line x1="-10" y1="15" x2="5" y2="15"/>
    <line x1="-10" y1="20" x2="5" y2="20"/>
    <line x1="-10" y1="25" x2="5" y2="25"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="210" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle" font-weight="500">Course Image</text>
  <text x="200" y="235" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="middle">No image available</text>
</svg>
