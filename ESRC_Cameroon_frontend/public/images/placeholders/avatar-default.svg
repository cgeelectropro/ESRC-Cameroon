<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Background -->
  <rect width="96" height="96" rx="48" fill="#f5f5f5"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="avatarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="48" fill="url(#avatarGrad)"/>
  
  <!-- User icon -->
  <g fill="#1B5E20" opacity="0.6">
    <!-- Head -->
    <circle cx="48" cy="28" r="10"/>
    <!-- Body -->
    <path d="M 48,38 Q 35,45 35,55 L 61,55 Q 61,45 48,38 Z"/>
  </g>
  
  <!-- Border -->
  <circle cx="48" cy="48" r="48" fill="none" stroke="#e0e0e0" stroke-width="1"/>
</svg>
